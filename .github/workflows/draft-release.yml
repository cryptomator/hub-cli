name: Draft a Hub CLI Release

on:
  push:
    tags:
      - '*'

env:
  JAVA_DIST: 'graalvm'
  JAVA_VERSION: '21'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  create-release-draft:
    name: Compile, Test and Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the git tag is signed
        run: git cat-file -p "${GITHUB_REF_NAME}" | grep "BEGIN SSH SIGNATURE"
      - name: Check the git tag is on main or release branch
        run: git branch -r --contains "${GITHUB_REF_NAME}" | grep -E '^\s*origin/(main|release/.*)\s*$'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Test
        run: ./mvnw -B clean verify
      - name: Draft a release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          token: ${{ secrets.CRYPTOBOT_RELEASE_TOKEN }}
          generate_release_notes: true
          body_path: .github/release-body.md.template

  build-native-image:
    needs: [create-release-draft]
    uses: ./.github/workflows/native-image.yml
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}
      upload-to-draft: true
    secrets: inherit

  update-sha256sums:
    name: Update checksums in release body
    runs-on: ubuntu-latest
    needs: [build-native-image]
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.CRYPTOBOT_RELEASE_TOKEN }}
    steps:
      - name: Update release body with checksums
        run: |
          CURRENT_BODY=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)
          RELEASE_BODY=$(printf '%s\n' "${CURRENT_BODY}" | sed '/<!-- HEADER -->/,/<!-- \/HEADER -->/c\
          <!-- HEADER -->\
          > [!NOTE]\
          > Release artifacts finished building successfully.\
          >\
          > SHA-256 checksums have been updated below.\
          <!-- /HEADER -->')

          export HUB="${HUB_SHA}  hub"
          export COMPLETION="${COMPLETION_SHA}  HubCli_completion.sh"

          envsubst '$HUB $COMPLETION' \
            <<< "${RELEASE_BODY}" \
            > release-body.md

          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --notes-file release-body.md
        env:
          HUB_SHA: ${{ needs.build-native-image.outputs.sha256-hub }}
          COMPLETION_SHA: ${{ needs.build-native-image.outputs.sha256-completion }}
